# Checks on pull requests and main pushes; also available from the Actions tab:
#   web      type check, the legal and old-name guards, build, CST self-test and the export / drawing /
#            bundle checks (Linux)
#   windows  the official openEMS MSVC build + its Python wheels, the Python test suite and one
#            small real simulation, to prove the Windows code paths (output capture, process
#            groups, DLL lookup) against a real openEMS
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full: ${{ steps.scope.outputs.full }}
      native: ${{ steps.scope.outputs.native }}
      reuse: ${{ steps.scope.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-ci-scope.mjs
      - id: scope
        run: node scripts/ci-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  web:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native OS file locks (stdlib only, no solver SDK)
        if: needs.plan.outputs.native == 'true'
        run: python3 -m unittest discover -s python/tests -p test_filelocks_native.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install-count consent and scheduling checks (fake HTTP, no reports sent)
        if: needs.plan.outputs.full == 'true'
        run: npm run -s check:telemetry
      - run: npx tsc --noEmit
      - run: npm run -s check:licenses
      - run: npm run -s check:documents
      - run: npm run -s check:legal
      - run: npm run -s check:no-antenlab
      - run: npm run -s check:installer-info
      - run: npm run -s check:linux-desktop
      - if: needs.plan.outputs.full == 'true'
        run: npm run -s check:designer
      - if: needs.plan.outputs.full == 'true'
        run: npm run -s build
      - if: needs.plan.outputs.full == 'true'
        run: npm run -s check:cst
      - if: needs.plan.outputs.full == 'true'
        run: npm run -s check:exports
      - name: Result export contracts
        run: |
          node --experimental-strip-types scripts/check-result-data.mjs
          node --experimental-strip-types scripts/check-result-touchstone.mjs
      - run: npm run -s check:docs-translations
      - run: npm run -s check:docs-highlight
      - if: needs.plan.outputs.full == 'true'
        run: npm run -s check:state-lifecycle
      - name: Documentation and website build
        if: needs.plan.outputs.full != 'true'
        run: npm run build:site
      - name: Manual browser regressions
        if: needs.plan.outputs.full == 'true'
        run: npm run -s check:browser-manual

  windows:
    # Cheap manifest/static checks must pass before allocating the expensive native runner.
    needs: [plan, web]
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.reuse != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OPENEMS_TAG: v0.37.0-rc3
      # no PYTHONUTF8: run with the default ANSI code page (cp1252) that users have, so a missing
      # encoding="utf-8" fails here instead of on their machines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install-count consent and scheduling checks (fake HTTP, no reports sent)
        run: npm run -s check:telemetry

      - name: Cache official openEMS archive
        id: openems-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/openems-download
          key: openems-${{ runner.os }}-${{ runner.arch }}-cp313-${{ env.OPENEMS_TAG }}
      - name: Install openEMS (official MSVC build and its Python wheels)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'openems-download'
          New-Item -ItemType Directory -Force $downloadDir | Out-Null
          if (-not (Get-ChildItem "$downloadDir/openEMS_x64_*_msvc.zip" -ErrorAction SilentlyContinue)) {
            gh release download $env:OPENEMS_TAG -R thliebig/openEMS-Project -p "openEMS_x64_*_msvc.zip" -D $downloadDir
            if ($LASTEXITCODE -ne 0) { throw "openEMS archive download failed" }
          }
          $zip = Get-ChildItem "$downloadDir/openEMS_x64_*_msvc.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:\opt\unpack -Force
          $exe = Get-ChildItem C:\opt\unpack -Recurse -Filter openEMS.exe | Select-Object -First 1
          if (-not $exe) { throw "openEMS.exe not found in $($zip.Name)" }
          $root = $exe.Directory.FullName
          Write-Host "openEMS root: $root"
          Get-ChildItem $root | Select-Object -First 40 | Format-Table Name, Length
          "OPENEMS_INSTALL_PATH=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $root | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $wheels = Get-ChildItem C:\opt\unpack -Recurse -Filter "*cp313*win_amd64.whl"
          if (-not $wheels) { throw "no cp313 wheels in $($zip.Name)" }
          $wheels | ForEach-Object { Write-Host "wheel: $($_.Name)" }
          python -m pip install --upgrade pip
          python -m pip install numpy h5py $wheels.FullName

      - name: Import check
        shell: pwsh
        working-directory: python
        run: python -c "import fairbeam, CSXCAD, openEMS; print('fairbeam', fairbeam.__version__, 'CSXCAD', CSXCAD.__file__)"

      - name: Smoke simulation (coarse dipole, real openEMS)
        if: needs.plan.outputs.native == 'true'
        shell: pwsh
        working-directory: python
        run: |
          python -m fairbeam run models/dipole.py --set mesh_div=10 --points 101 --end-db -30 --threads 2 `
            --name ci-dipole --out "$env:RUNNER_TEMP\out" --sim-root "$env:RUNNER_TEMP\sim"
          python ../scripts/ci-check-bundle.py "$env:RUNNER_TEMP\out\ci-dipole.json"

      - name: Python tests
        shell: pwsh
        working-directory: python
        if: ${{ !cancelled() && needs.plan.outputs.native == 'true' }}
        run: python -m unittest discover -s tests -v

      - name: Browser scenarios (English and Turkish, no additional solver run)
        shell: pwsh
        run: |
          $env:FAIRBEAM_PYTHON = (Get-Command python).Source
          $env:PYTHONUTF8 = '1'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          node scripts/check-scenarios.mjs --skip-run

      - name: Circular-polarization synthetic field and display contracts
        shell: pwsh
        run: |
          $env:FAIRBEAM_PYTHON = (Get-Command python).Source
          $env:PYTHONUTF8 = '1'
          node --experimental-strip-types scripts/check-circular.mjs

      - name: Viewer identity, result recovery and Compare layout regressions
        shell: pwsh
        env:
          FAIRBEAM_TEST_ARTIFACTS: ${{ runner.temp }}/fairbeam-scenario-failures/viewer-regressions
        run: |
          $env:FAIRBEAM_PYTHON = (Get-Command python).Source
          $env:PYTHONUTF8 = '1'
          node scripts/check-selected-result-deadline-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-compare-bounds-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-user-project-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-quit-activity-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-circular-browser.mjs

      - name: Keep browser failure evidence (including recovered attempts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-failures
          path: ${{ runner.temp }}/fairbeam-scenario-failures
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the smoke bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7

  gate:
    needs: [plan, web, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          PLAN: ${{ needs.plan.result }}
          WEB: ${{ needs.web.result }}
          WINDOWS: ${{ needs.windows.result }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          test "$PLAN" = success
          if [ "$REUSE" = true ]; then
            test "$WEB" = skipped && test "$WINDOWS" = skipped
          else
            test "$WEB" = success
            if [ "$FULL" = true ]; then test "$WINDOWS" = success; else test "$WINDOWS" = skipped; fi
          fi
