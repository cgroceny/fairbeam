[package]
name = "fairbeam"
version = "0.7.2"
description = "Fairbeam desktop shell: installs the runtime, starts the local run server and shows the viewer"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# optional sign-in (docs/ACCOUNTS.md): only with `--features accounts`, off by default
# (reqwest and rustls are also the HTTP client of the `telemetry` feature)
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
url = { version = "2", optional = true }
tokio = { version = "1", optional = true, features = ["time"] }

# macOS update install beside the app when it is not on the system volume (src/macos_update.rs);
# the same crates tauri-plugin-updater already uses
[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
libc = "0.2"

[features]
default = ["telemetry"]
# sign in with GitHub or Google (docs/ACCOUNTS.md); off: no account code, commands or network
accounts = ["dep:keyring", "dep:reqwest", "dep:rustls", "dep:sha2", "dep:base64", "dep:getrandom", "dep:url", "dep:tokio"]
# Opt-in install counts (docs/TELEMETRY.md). Without this feature nothing is sent.
telemetry = ["dep:reqwest", "dep:rustls", "dep:getrandom"]

[dev-dependencies]
# the account module's core (PKCE, parsers, flows against a fake HTTP layer) is unit-tested without the feature
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = "symbols"
