<!doctype html>
<html lang="en">

<meta charset="utf-8" />

<title>Fairbeam</title>
<style>
  /* Values mirror design-system/tokens.css (the splash is shown before the viewer loads). */
  :root {
    color-scheme: light dark;
    --al-bg: #f7f6f3; --al-surface: #ffffff; --al-surface-2: #efeeea; --al-border: #dedcd6;
    --al-text: #181715; --al-text-2: #5d5a53; --al-text-3: #6d6961;
    --al-action: #9c5426; --al-action-text: #ffffff; --al-accent-text: #7e431f; --al-brand-mark: #b8672f;
    --al-critical: #b02e2e; --al-focus: #9c5426;
    --al-font-sans: -apple-system, "IBM Plex Sans", system-ui, sans-serif;
    --al-font-mono: "SF Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --al-bg: #121110; --al-surface: #1a1917; --al-surface-2: #22211f; --al-border: #2e2d2a;
      --al-text: #f2f0eb; --al-text-2: #c6c2b8; --al-text-3: #a29e94;
      --al-action: #cf8147; --al-action-text: #1a1917; --al-accent-text: #dda172; --al-brand-mark: #cf8147;
      --al-critical: #ef6b6b; --al-focus: #dda172;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--al-bg); color: var(--al-text);
    font: 13px/1.5 var(--al-font-sans); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
  }
  main { width: min(560px, calc(100vw - 48px)); display: grid; gap: 16px; }
  /* Long diagnostics must remain reachable in a scaled, short desktop window. */
  @media (max-height: 900px) {
    body { padding-block: 24px; align-items: safe center; }
    main { min-height: 0; max-height: calc(100dvh - 48px); overflow: auto; }
    main > * { min-width: 0; }
    main button { max-width: 100%; height: auto; min-height: 30px; overflow-wrap: anywhere; }
  }
  /* the lockup of the brand kit (as src/components/Lockup.tsx): plate 32 px, wordmark in the text colour */
  .brand svg { display: block; width: 206px; height: 32px; color: var(--al-text); }
  #status { display: flex; align-items: center; gap: 10px; min-height: 24px; color: var(--al-text-2); font-size: 14px; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--al-border); border-top-color: var(--al-action); animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .meta { color: var(--al-text-3); font: 12px var(--al-font-mono); overflow-wrap: anywhere; }
  .card { display: grid; gap: 12px; padding: 16px; background: var(--al-surface); border: 1px solid var(--al-border); border-radius: 10px; -webkit-user-select: text; user-select: text; }
  .card h2 { margin: 0; font-size: 15px; }
  .card p { margin: 0; color: var(--al-text-2); }
  pre { margin: 0; padding: 10px 12px; background: var(--al-surface-2); border-radius: 6px; font: 12px/1.6 var(--al-font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  ul { margin: 0; padding-left: 18px; color: var(--al-text-3); font: 11.5px/1.6 var(--al-font-mono); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--al-border); background: transparent;
    color: var(--al-text); font: 500 13px var(--al-font-sans); cursor: pointer;
  }
  button:hover { background: var(--al-surface-2); }
  button.primary { background: var(--al-action); color: var(--al-action-text); border-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--al-focus); outline-offset: 2px; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--al-text-2); }
  .error { color: var(--al-critical); }
  .bar { height: 6px; border-radius: 3px; background: var(--al-surface-2); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--al-action); transition: width 0.2s ease; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar.indeterminate > div { animation: none; width: 100%; opacity: 0.4; } }
  ol.steps { margin: 0; padding-left: 20px; color: var(--al-text-3); font-size: 12.5px; line-height: 1.8; }
  ol.steps li.done { color: var(--al-text-2); }
  ol.steps li.now { color: var(--al-text); font-weight: 600; }
  .cands { display: grid; gap: 6px; }
  .cands button { justify-self: start; font: 12px var(--al-font-mono); }
  [hidden] { display: none !important; }
</style>
</head>

  applyLang();

  const T = window.__TAURI__;
  const invoke = (cmd, args) => (T && T.core ? T.core.invoke(cmd, args) : Promise.resolve(null));
  const $ = (id) => document.getElementById(id);

  const STEPS = ["download-uv", "install-python", "create-venv", "download-openems", "unpack-openems",
    "install-packages", "install-openems-wheels", "install-app", "verify"];
  let lastStep = -1;

  function show(s) {
    if (!s || !s.phase) return;
    if (s.lang) applyLang(s.lang);
    const busy = ["searching", "starting", "ready", "installing"].includes(s.phase);
    $("spin").hidden = !busy;
    $("text").textContent = known(s.text);
    const meta = [];
    if (s.python) meta.push(`python ${s.python}`);
    if (s.openems) meta.push(`openEMS ${s.openems}${s.gpu ? ` · ${L("gpuEngine")}` : ""}`);
    if (s.port) meta.push(`127.0.0.1:${s.port}`);
    if (s.note) meta.push(s.note);
    $("meta").textContent = meta.join("  ·  ");
    // the setup and error cards carry their own heading: no second copy in the status line
    $("status").hidden = s.phase === "setup" || s.phase === "error" || s.phase === "installing";
    $("setup").hidden = s.phase !== "setup";
    $("installing").hidden = s.phase !== "installing";
    $("failure").hidden = s.phase !== "error";
    if (s.phase === "setup") {
      lastStep = -1;
      $("setup-title").textContent = known(s.text);
      $("setup-detail").textContent = known(s.detail);
      $("install").hidden = !s.canInstall;
      $("use-managed").hidden = !s.managedReady;
      $("install").textContent = s.install ? L("installSize", { mb: s.install.downloadMB }) : L("install");
      const notes = [];
      if (s.installNote) notes.push(s.installNote);
      if (s.runtime) notes.push(L("runtimeFolder", { path: s.runtime }));
      $("install-note").textContent = notes.join("  ·  ");
      $("tried").replaceChildren(...(s.tried || []).map((t) => {
        const li = document.createElement("li");
        li.textContent = `${t.python} (${t.why}): ${t.result}`;
        return li;
      }));
      $("gpu-row").hidden = !s.gpuAvailable;
      if (s.gpuPath) $("gpu-path").textContent = s.gpuPath;
      $("gpu").checked = !!s.preferGpu;
      const showGpuRuntime = !!s.managedReady;
      $("gpu-runtime-row").hidden = !showGpuRuntime;
      $("install-gpu-runtime").hidden = !showGpuRuntime || !s.gpuSupported || !!s.gpuRuntimeReady;
      $("install-gpu-runtime").disabled = !!s.gpuRuntimeInstalling;
      if (s.gpuRuntimeInstalling) {
        $("gpu-runtime-status").textContent = L("gpu.installing");
      } else if (s.gpuRuntimeReady) {
        $("gpu-runtime-status").textContent = L(s.gpuRuntimeEnabled ? "gpu.readyEnabled" : "gpu.ready");
      } else if (s.gpuSupported) {
        const adapter = s.gpuAdapter ? ` · ${s.gpuAdapter}${s.gpuDriver ? ` · ${s.gpuDriver}` : ""}` : "";
        $("gpu-runtime-status").textContent = `${L("gpu.install")}${adapter}`;
      } else {
        const reason = s.gpuSupportReason && TEXT.en[`gpu.${s.gpuSupportReason}`] ? `gpu.${s.gpuSupportReason}` : "gpu.notReady";
        $("gpu-runtime-status").textContent = L(reason);
      }
      $("settings").textContent = s.settings ? L("settings", { path: s.settings }) : "";
    }
    if (s.phase === "installing") {
      const k = STEPS.indexOf(s.step);
      if (k >= 0) lastStep = k;
      $("steps").replaceChildren(...STEPS.map((id, i) => {
        const li = document.createElement("li");
        li.textContent = L(`step.${id}`);
        li.className = i < lastStep ? "done" : i === lastStep ? "now" : "";
        return li;
      }));
      const f = typeof s.fraction === "number" ? s.fraction : null;
      $("bar").classList.toggle("indeterminate", f === null);
      $("bar").firstElementChild.style.width = f === null ? "" : `${Math.round(f * 100)}%`;
      $("inst-msg").textContent = s.message || "";
      $("inst-log").textContent = s.log ? L("log", { path: s.log }) : "";
    }
    if (s.phase === "error") {
      $("fail-title").textContent = known(s.text);
      $("fail-detail").textContent = s.detail || "";
      $("fail-log").textContent = s.log ? L("log", { path: s.log }) : "";
      $("repair").hidden = !s.installFailed;
    }
  }
  window.fairbeamSplash = show;
  $("retry2").addEventListener("click", () => invoke("retry"));
  $("install").addEventListener("click", () => invoke("install_runtime", { repair: false }));
  $("install-gpu-runtime").addEventListener("click", () => invoke("install_gpu_runtime"));
  $("use-managed").addEventListener("click", () => invoke("use_managed"));
  $("repair").addEventListener("click", () => invoke("install_runtime", { repair: true }));
  for (const id of ["choose", "choose2"]) $(id).addEventListener("click", () => invoke("choose_python"));
  $("gpu").addEventListener("change", (e) => invoke("set_prefer_gpu", { value: e.target.checked }));
  invoke("splash_state").then(show);
</script>
</body>
</html>
